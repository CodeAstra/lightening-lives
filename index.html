    try {
      var last = window.localStorage.getItem('ll-compare/last');
      if (['daylight', 'scale', 'strand', 'tree', 'helix', 'sun-card', 'film'].indexOf(last) !== -1) target = last + '.html';
    } catch (error) { /* storage unavailable: keep the default */ }

  })();
</script>
